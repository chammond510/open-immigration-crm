[project]
name = "open-immigration-crm"
version = "0.1.0"
description = "A focused, self-hosted CRM for immigration law firms."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["crm/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ001", "DJ012"]

[tool.coverage.run]
source = ["crm"]
omit = ["crm/migrations/*", "crm/management/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
