<div class="checklist-row {% if item.is_completed %}completed{% endif %}"><form method="post" action="{% url 'checklist_toggle' item.pk %}"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><button class="completion-toggle" type="submit" aria-label="{% if item.is_completed %}Mark {{ item.title }} not done{% else %}Mark {{ item.title }} done{% endif %}">{% if item.is_completed %}✓{% endif %}</button></form><div><strong>{{ item.title }}</strong>{% if item.description %}<span>{{ item.description }}</span>{% endif %}</div></div>
