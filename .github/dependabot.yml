version: 2
updates:
  # requirements.lock and requirements-dev.lock are compiled by uv from the .in files, and
  # Dependabot edits only the .in files. So it proposes a change only when a new release falls
  # outside a declared range, and skips major versions, which are upgrades someone plans (Django
  # stays on its 5.2 long-term support line). Advisories against the pinned versions are caught
  # by pip-audit in CI, which also runs weekly.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  # The image stays on Python 3.12, the version the lock files are compiled for.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
