name = "Aircall"
capabilities = ["phone"]

[[connector]]
key = "zoom_phone"
name = "Zoom Phone"
capabilities = ["phone"]

[[connector]]
key = "vonage"
name = "Vonage"
capabilities = ["phone", "texting"]

[[connector]]
key = "eight_by_eight"
name = "8x8"
