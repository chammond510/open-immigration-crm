# Providers people have asked for that have no connector yet. Each appears in
# the Connections catalog as "Wanted" until a connector with the same key is
# installed. Keys and capabilities follow crm/connect/base.py. Listing a name
# here identifies compatibility only and implies no affiliation or endorsement.
# docs_url is the provider's developer documentation and api_access how its
# API is opened up (open, approval, partner, or none), checked 2026-10-30.

# Phone and texting

[[connector]]
key = "ringcentral"
name = "RingCentral"
capabilities = ["phone", "texting"]
description = "Log calls and send and receive texts through the firm's RingCentral numbers."
docs_url = "https://developers.ringcentral.com/"
api_access = "open"

[[connector]]
key = "aircall"
name = "Aircall"
capabilities = ["phone"]
description = "Log calls made and taken on the firm's Aircall lines, with recordings."
docs_url = "https://developer.aircall.io/"
api_access = "open"

[[connector]]
key = "zoom_phone"
name = "Zoom Phone"
capabilities = ["phone"]
description = "Log calls on the firm's Zoom Phone numbers, with recordings."
docs_url = "https://developers.zoom.us/docs/api/phone/"
api_access = "open"

[[connector]]
key = "vonage"
name = "Vonage"
capabilities = ["phone", "texting"]
description = "Log calls and send and receive texts through the firm's Vonage numbers."
docs_url = "https://developer.vonage.com/en/vonage-business-cloud/overview"
api_access = "approval"

[[connector]]
key = "eight_by_eight"
name = "8x8"
capabilities = ["phone"]
description = "Log calls made and taken on the firm's 8x8 lines."
docs_url = "https://developer.8x8.com/analytics"
api_access = "open"

[[connector]]
key = "nextiva"
name = "Nextiva"
capabilities = ["phone"]
description = "Log calls made and taken on the firm's Nextiva lines."
docs_url = "https://developer.nextiva.com/"
api_access = "partner"

[[connector]]
key = "telnyx"
name = "Telnyx"
capabilities = ["phone", "texting"]
description = "Log calls and send and receive texts through the firm's Telnyx numbers."
docs_url = "https://developers.telnyx.com/"
api_access = "open"

[[connector]]
key = "teams_phone"
name = "Microsoft Teams Phone"
capabilities = ["phone"]
description = "Log calls made and taken in Microsoft Teams Phone."
docs_url = "https://learn.microsoft.com/en-us/graph/api/resources/callrecords-api-overview"
api_access = "open"

# Mailbox, calendar, and storage suites

[[connector]]
key = "zoho_mail"
name = "Zoho Mail"
capabilities = ["mailbox"]
description = "File email with clients from Zoho Mail; it works today over IMAP and SMTP."
docs_url = "https://www.zoho.com/mail/help/api/"
api_access = "open"
works_through = "imap_smtp"

[[connector]]
key = "caldav"
name = "CalDAV calendar"
capabilities = ["calendar"]
description = "Keep appointments in step with a CalDAV calendar, such as iCloud or Fastmail."
docs_url = "https://datatracker.ietf.org/doc/html/rfc4791"
api_access = "open"

